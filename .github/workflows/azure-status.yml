name: Azure status

# Shows what the hosted Job Radar pulled (shared job pool and each person's matches) in the run summary.
on:
  workflow_dispatch:
    inputs:
      search_everyone:
        description: "Also start a search for everybody now"
        type: boolean
        default: false
      pubkey:
        description: "Optional RSA public key (PEM, base64). Per-person detail is encrypted to it instead of being hidden."
        type: string
        default: ""

permissions:
  contents: read

jobs:
  status:
    if: github.repository == 'akhileshr1122-ui/Job-radar-app'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Read status
        env:
          RG: ${{ vars.JR_RESOURCE_GROUP || 'job-radar' }}
          JR_STATUS_DETAIL: ${{ github.event.repository.private && '1' || '0' }}
        run: |
          pip install -q azure-storage-blob
          acct=$(az storage account list -g "$RG" --query "[0].name" -o tsv)
          export STORAGE_CONNECTION=$(az storage account show-connection-string -g "$RG" -n "$acct" -o tsv)
          echo "::add-mask::$STORAGE_CONNECTION"
          python tools/azure_status.py
          if [ "${{ inputs.search_everyone }}" = "true" ]; then
            for u in $(az storage blob list -c jobradar --prefix users/ --delimiter / --connection-string "$STORAGE_CONNECTION" --query "[].name" -o tsv); do
              uid=$(echo "$u" | cut -d/ -f2)
              az storage message put -q jobradar-runs --content "{\"uid\": \"$uid\", \"search\": true}" --connection-string "$STORAGE_CONNECTION" -o none && echo "Search queued for one account"
            done
          fi
          echo "::notice::Queue job runs: $(az containerapp job execution list -n jobradar-queue -g "$RG" --query "[0:5].{s:properties.status,t:properties.startTime}" -o tsv 2>/dev/null | tr '\n' ' ')"
          echo "::notice::Queue length: $(az storage message peek -q jobradar-runs --num-messages 32 --connection-string "$STORAGE_CONNECTION" --query 'length(@)' -o tsv 2>/dev/null)"
          echo "::notice::Bulk job runs: $(az containerapp job execution list -n jobradar-bulk -g "$RG" --query "[0:3].{s:properties.status,t:properties.startTime}" -o tsv 2>/dev/null | tr '\n' ' ')"
      - name: Encrypted detail
        if: inputs.pubkey != ''
        env:
          RG: ${{ vars.JR_RESOURCE_GROUP || 'job-radar' }}
          PUBKEY: ${{ inputs.pubkey }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt -o none
          az extension add --name containerapp --only-show-errors || true
          acct=$(az storage account list -g "$RG" --query "[0].name" -o tsv)
          export STORAGE_CONNECTION=$(az storage account show-connection-string -g "$RG" -n "$acct" -o tsv)
          echo "::add-mask::$STORAGE_CONNECTION"
          d=$(mktemp -d); echo "$PUBKEY" | base64 -d > $d/pub.pem
          JR_STATUS_OUT=$d/detail.txt python tools/azure_status.py || echo "status script failed: $?" >> $d/detail.txt
          ws=$(az monitor log-analytics workspace list -g "$RG" --query "[0].customerId" -o tsv)
          for job in jobradar-queue jobradar-bulk; do
            echo "=== $job executions" >> $d/detail.txt
            az containerapp job execution list -n $job -g "$RG" --query "[0:8].{s:properties.status,t:properties.startTime,e:properties.endTime}" -o tsv >> $d/detail.txt 2>&1
          done
          echo "=== recent queue job logs" >> $d/detail.txt
          az monitor log-analytics query -w "$ws" --analytics-query "ContainerAppConsoleLogs_CL | where TimeGenerated > ago(4d) | extend g = strcat(column_ifexists('ContainerJobName_s', ''), column_ifexists('ContainerGroupName_s', '')), m = strcat(column_ifexists('Log_s', ''), column_ifexists('Log', '')) | where g contains 'jobradar-queue' | order by TimeGenerated desc | take 400 | project TimeGenerated, m" -o tsv >> $d/detail.txt 2>&1 || true
          gzip -9 $d/detail.txt
          openssl rand -hex 32 > $d/k
          openssl enc -aes-256-cbc -pbkdf2 -salt -in $d/detail.txt.gz -out $d/detail.enc -pass file:$d/k
          openssl pkeyutl -encrypt -pubin -inkey $d/pub.pem -pkeyopt rsa_padding_mode:oaep -in $d/k | base64 -w0 > $d/k.b64
          echo "::notice::ENCKEY $(cat $d/k.b64)"
          (base64 -w0 $d/detail.enc; echo) | fold -w 30000 > $d/chunks
          n=$(wc -l < $d/chunks); i=0
          while read -r c; do i=$((i+1)); echo "::notice::ENC $i/$n $c"; done < $d/chunks
